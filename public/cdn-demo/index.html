<!DOCTYPE html>
<html>
  <head>
    <title>React with CDN</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script> 
    <!-- //react is a core library for building user interfaces. -->
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script> 
    <!-- // Helps render React elements into the DOM (like putting it into div#root) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script> 
    <!-- //Converts JSX (React-like HTML) into JavaScript that browsers can understand. -->
  </head>
  <body>
    <div id="root">
       
    </div>
<div>
    <button id="btn">Click Me</button>
    <script>
        document.getElementById('btn').addEventListener('click', function() {
            alert('Button clicked!');
        });
        </script>
</div>
    <script type="text/babel">
      function App() {
        return <h1>Hi Komal Sachdeva </h1>;

      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
